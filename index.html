<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大一木材 ゼネコン様向け Web受注デモ</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Yu Gothic',sans-serif;margin:0;background:#f4f6f3;color:#233a2d}header{background:#244d38;color:white;padding:16px 20px;position:sticky;top:0;z-index:4}main{max-width:920px;margin:auto;padding:16px 16px 100px}h1{font-size:20px;margin:0}h2{font-size:21px}.card{background:white;border:1px solid #dde5dd;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}button{background:#286346;color:white;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font:inherit}.light{background:#e7eee8;color:#244d38}.selected{background:#286346;color:white}.pill{margin:4px}.muted{color:#657469;font-size:13px}.price{font-size:22px;font-weight:700}.photo{height:135px;border-radius:9px;background:repeating-linear-gradient(10deg,#d6b789 0 15px,#bc9566 16px 21px,#e1c397 22px 37px);display:grid;place-items:center}.photo span{background:#fff9;padding:8px;border-radius:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stickycart{position:fixed;bottom:12px;right:12px;z-index:8;width:min(360px,calc(100vw - 24px));background:white;border:1px solid #b5c9b7;border-radius:14px;box-shadow:0 5px 25px #0003;overflow:hidden}.carthead{width:100%;text-align:left;display:flex;justify-content:space-between}.cartbody{max-height:42vh;overflow:auto;padding:12px}.cartitem{padding:9px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:10px}.qty button{padding:6px 12px}.qty strong{min-width:32px;text-align:center}input,textarea{display:block;width:100%;border:1px solid #b6c4b8;border-radius:8px;padding:11px;font:inherit;margin:5px 0 13px}label{font-weight:600;display:block}.wide{width:100%}.notice{background:#fff4d9;padding:14px;border-radius:10px}.success{text-align:center;padding:28px 15px}.success h2{font-size:clamp(26px,6vw,40px);line-height:1.6;color:#245b3a}.qty-detail{flex-wrap:wrap;justify-content:flex-end;gap:5px}.qty-detail button{padding:9px 10px;min-width:48px}.qty-detail strong{min-width:40px;font-size:18px}.hidden{display:none}</style></head><body><header><h1>大一木材｜ゼネコン様向けWeb受注</h1><small>提案用デモ・実際の注文送信は行いません</small></header><main id="app"></main><div id="cartbox" class="stickycart"></div><script>
const items=[{"id": "G002", "name": "コンパネ", "grade": "NonJAS", "size": "12mm×3×6", "price": 1500, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G003", "name": "ウレタン", "grade": "黄色", "size": "12mm×3×6", "price": 2200, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G004", "name": "コンパネ", "grade": "B", "size": "12mm×3×6", "price": 1000, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G005", "name": "ラワンべニヤ", "grade": "規格品", "size": "5.5mm×3×6", "price": 850, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G006", "name": "ラワンべニヤ", "grade": "規格品", "size": "2.5mm×3×6", "price": 650, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G007", "name": "端太角", "grade": "杉", "size": "4000×90×90", "price": 1300, "unit": "本", "pack": 1, "ship": "1本", "area": null}, {"id": "G008", "name": "端太角", "grade": "杉", "size": "3000×90×90", "price": 1000, "unit": "本", "pack": 1, "ship": "1本", "area": null}, {"id": "G009", "name": "端太角", "grade": "杉", "size": "2000×90×90", "price": 700, "unit": "本", "pack": 1, "ship": "1本", "area": null}, {"id": "G010", "name": "端太角", "grade": "杉", "size": "1000×90×90", "price": 400, "unit": "本", "pack": 1, "ship": "1本", "area": null}, {"id": "G011", "name": "桟木", "grade": "杉", "size": "4000×48×24", "price": 250, "unit": "束", "pack": 6, "ship": "6本1束", "area": null}, {"id": "G012", "name": "桟木", "grade": "杉", "size": "3000×48×24", "price": 200, "unit": "束", "pack": 6, "ship": "6本1束", "area": null}, {"id": "G013", "name": "桟木", "grade": "トドマツ", "size": "4000×48×24", "price": 310, "unit": "束", "pack": 10, "ship": "10本1束", "area": null}, {"id": "G014", "name": "桟木", "grade": "トドマツ", "size": "3650×48×24", "price": 290, "unit": "束", "pack": 10, "ship": "10本1束", "area": null}, {"id": "G015", "name": "測量杭", "grade": "杉", "size": "900×45×40", "price": 180, "unit": "束", "pack": 20, "ship": "20本1束", "area": null}, {"id": "G016", "name": "貫板", "grade": "杉", "size": "3000×90×13", "price": 250, "unit": "束", "pack": 10, "ship": "10本1束", "area": null}, {"id": "G017", "name": "半貫板", "grade": "杉", "size": "3650×45×13", "price": 200, "unit": "束", "pack": 20, "ship": "20本1束", "area": null}, {"id": "G018", "name": "敷板", "grade": "杉", "size": "4000×200×30", "price": 1200, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G019", "name": "合板足場板", "grade": "新品", "size": "4000×240×35", "price": 5400, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G020", "name": "厚ベニヤ", "grade": "B", "size": "1820×910×24", "price": 3800, "unit": "枚", "pack": 1, "ship": "1枚", "area": null}, {"id": "G021", "name": "矢板", "grade": "杉", "size": "1500mm　厚30(27)mm", "price": 990, "unit": "段", "pack": 1, "ship": "1段", "area": 1.5}, {"id": "G022", "name": "矢板", "grade": "杉", "size": "2000mm　厚30(27)mm", "price": 990, "unit": "段", "pack": 1, "ship": "1段", "area": 2}];let group=null,grade=null,current=null,qty=1,cart=[],open=false,step='browse';const app=document.getElementById('app'),cartbox=document.getElementById('cartbox');const yen=n=>'¥'+n.toLocaleString('ja-JP');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const subtotal=p=>p.qty*p.price*(p.area||p.pack);const total=()=>cart.reduce((s,x)=>s+subtotal(x),0);const units=p=>p.unit==='束'?`${p.qty}束（${p.qty*p.pack}本）`:p.unit==='段'?`${p.qty}段`:p.qty+p.unit;const area=p=>p.area?` ／ ${(p.qty*p.area).toFixed(1)}㎡`:'';
function renderCart(){let n=cart.reduce((s,x)=>s+x.qty,0);cartbox.innerHTML=`<button class="carthead" onclick="toggleCart()">🛒 カゴ ${cart.length}商品・${n}単位 <b>${yen(total())} ${open?'▼':'▲'}</b></button>${open?`<div class="cartbody">${cart.length?cart.map((p,i)=>`<div class="cartitem"><b>${esc(p.name)} ${esc(p.grade)}</b><div class="muted">${esc(p.size)}</div><div>${units(p)}${area(p)}</div><div class="row"><b>${yen(subtotal(p))}</b><div class="qty"><button class="light" onclick="adjust(${i},-1)">−</button>${p.qty}<button class="light" onclick="adjust(${i},1)">＋</button><button class="light" onclick="remove(${i})">削除</button></div></div></div>`).join(''):'商品はまだありません'}<h3>商品代金合計：${yen(total())}</h3><p class="muted">矢板は㎡単価で計算しています。税区分・送料は未確定です</p>${cart.length?'<button class="wide" onclick="checkout()">お客様情報・配送希望日へ</button>':''}</div>`:''}`;cartbox.style.display=step==='done'?'none':'block'}
function toggleCart(){open=!open;renderCart()}function adjust(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);renderCart()}function remove(i){cart.splice(i,1);renderCart()}
function browse(){step='browse';const names=[...new Set(items.map(p=>p.name))];let grades=group?[...new Set(items.filter(p=>p.name===group).map(p=>p.grade))]:[];let filtered=items.filter(p=>p.name===group&&p.grade===grade);app.innerHTML=`<h2>商品を選択</h2><p class="muted">商品名 → 等級・樹種 → 寸法・商品詳細</p><div class="card"><b>① 商品名</b><p>${names.map(n=>`<button class="pill ${group===n?'selected':'light'}" onclick="selectGroup(${JSON.stringify(n).replace(/"/g,'&quot;')})">${esc(n)}</button>`).join('')}</p></div>${group?`<div class="card"><b>② 等級・樹種</b><p>${grades.map(g=>`<button class="pill ${grade===g?'selected':'light'}" onclick="selectGrade(${JSON.stringify(g).replace(/"/g,'&quot;')})">${esc(g)}</button>`).join('')}</p></div>`:''}${grade?`<h3>③ 商品・寸法</h3><div class="grid">${filtered.map(p=>`<div class="card"><div class="photo"><span>商品画像準備中</span></div><h3>${esc(p.name)} ${esc(p.grade)}</h3><p>${esc(p.size)}</p><p class="price">${yen(p.price)} / ${p.area?'㎡':p.unit==='束'?'本':p.unit}</p><p class="muted">出荷単位：${esc(p.ship)}</p><button class="wide" onclick="detail('${p.id}')">詳細・数量入力</button></div>`).join('')}</div>`:''}`;renderCart()}
function selectGroup(s){group=s;grade=null;browse()}function selectGrade(s){grade=s;browse()}
function detail(id){step='detail';current=items.find(x=>x.id===id);qty=1;const p=current;app.innerHTML=`<button class="light" onclick="goBack()">← 商品一覧へ</button><div class="card"><div class="photo" style="height:220px"><span>商品画像準備中</span></div><h2>${esc(p.name)} ${esc(p.grade)}</h2><p>寸法：${esc(p.size)}</p><p class="muted">商品の詳しい特徴・用途は準備中です。</p><p class="price">${yen(p.price)} / ${p.area?'㎡':p.unit==='束'?'本':p.unit}</p><p>出荷単位：<b>${esc(p.ship)}</b></p><div class="row"><b>注文数量</b><div class="qty qty-detail"><button onclick="change(-100)">−100</button><button onclick="change(-10)">−10</button><button onclick="change(-1)">−1</button><strong id="qty">1</strong><button onclick="change(1)">＋1</button><button onclick="change(10)">＋10</button><button onclick="change(100)">＋100</button><span>${p.unit}</span></div></div><p id="calc"></p><button class="wide" onclick="add()">カゴに入れる</button></div>`;change(0);renderCart()}
function change(d){qty=Math.max(1,qty+d);document.getElementById('qty').textContent=qty;let p=current;document.getElementById('calc').textContent=`${p.unit==='束'?`${qty}束（${qty*p.pack}本）`:qty+p.unit}${p.area?' ／ '+(qty*p.area).toFixed(1)+'㎡':''}　小計：${yen(qty*p.price*(p.area||p.pack))}`}
function add(){let p=cart.find(x=>x.id===current.id);if(p)p.qty+=qty;else cart.push({...current,qty});open=true;browse()}
function checkout(){step='checkout';open=false;app.innerHTML=`<button class="light" onclick="goBack()">← 商品選択へ戻る</button><h2>お客様情報・配送希望日</h2><div class="card"><form id="order" onsubmit="finish(event)"><label>会社名（必須）<input name="company" required></label><label>ご担当者名（必須）<input name="contact" required></label><label>電話番号（必須）<input name="phone" type="tel" required></label><label>現場名（必須）<input name="site" required></label><label>納品先住所（必須）<input name="address" required></label><label>配送希望日（必須）<input name="date" id="date" type="date" required></label><label>備考<textarea name="notes" rows="3"></textarea></label><div class="notice">在庫・納期は確認後にご連絡いたします。これはデモのため注文送信は行われません。</div><p><button class="wide" type="submit">注文内容を確認（デモ）</button></p></form></div>`;const d=new Date();document.getElementById('date').min=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');renderCart()}
function finish(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());step='done';const message=['【ゼネコン様 Web受注デモ】',`会社：${f.company}`,`担当：${f.contact}`,`電話：${f.phone}`,`現場名：${f.site}`,`納品先：${f.address}`,`配送希望日：${f.date}`,'【注文商品】',...cart.map(p=>`管理ID：${p.id} ${p.name} ${p.grade} ${p.size} ${units(p)}${area(p)} 小計${yen(subtotal(p))}`),`商品代金合計：${yen(total())}`,`備考：${f.notes||'なし'}`].join('\n');app.innerHTML=`<div class="card success"><div style="font-size:44px">✓</div><h2>ご注文ありがとうございます。<br>お承りいたしました<br>納期、在庫の確認をして<br>ご連絡をいたします</h2><p class="notice">これはデモです。実際の注文は送信されていません。</p></div><div class="card"><h3>社内通知文面（デモ）</h3><textarea id="msg" rows="12" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('msg').value)">文面をコピー</button></div><button onclick="restart()">最初から試す</button>`;document.getElementById('msg').value=message;renderCart()}

// Navigation is recorded as real browser history entries, so the device Back button
// returns to the previous screen rather than leaving the form unexpectedly.
let navigationDepth=0;
let orderDraft={};
function snapshot(){return {group,grade,detailId:current?.id||null,qty,step,open}}
function recordHistory(){history.pushState(snapshot(),'','#'+(step==='browse'?'catalog':step)+'-'+Date.now())}
function navigated(fn){return function(...args){navigationDepth++;try{return fn(...args)}finally{navigationDepth--;if(navigationDepth===0)recordHistory()}}}
const originalBrowse=browse,originalDetail=detail,originalCheckout=checkout;
const originalSelectGroup=selectGroup,originalSelectGrade=selectGrade,originalFinish=finish;
browse=navigated(originalBrowse);
detail=navigated(originalDetail);
checkout=navigated(originalCheckout);
selectGroup=navigated(originalSelectGroup);
selectGrade=navigated(originalSelectGrade);
finish=navigated(originalFinish);
function goBack(){history.back()}
function restart(){cart=[];group=null;grade=null;current=null;qty=1;orderDraft={};open=false;browse()}
document.addEventListener('input',e=>{if(step==='checkout'&&e.target.form?.id==='order')orderDraft=Object.fromEntries(new FormData(e.target.form).entries())});
window.addEventListener('popstate',e=>{
 const state=e.state;
 if(!state||!state._gcDemo)return;
 group=state.group;grade=state.grade;open=state.open;current=items.find(x=>x.id===state.detailId)||null;
 navigationDepth++;
 try{
   if(state.step==='detail'&&current){originalDetail(current.id);change(Math.max(1,state.qty)-1)}
   else if(state.step==='checkout'){
     originalCheckout();
     const form=document.getElementById('order');
     for(const [name,value] of Object.entries(orderDraft)){if(form.elements.namedItem(name))form.elements.namedItem(name).value=value}
   }
   else {originalBrowse()}
 }finally{navigationDepth--}
});
// Store a marker to avoid interpreting history entries from other sites/apps.
const rawSnapshot=snapshot;
snapshot=()=>({...rawSnapshot(),_gcDemo:true});
history.replaceState(snapshot(),'','#catalog');
originalBrowse();
</script></body></html>
